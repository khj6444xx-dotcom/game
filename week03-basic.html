<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공 잡기 게임</title>

<style>
body{
    text-align:center;
    font-family:Arial;
}

canvas{
    border:3px solid #00aaff;
    background-color:#303030;
    box-shadow:0 0 12px #00aaff;
}
</style>

</head>
<body>

<h1>공 잡기 게임</h1>

<p>
점수 : <span id="score">0</span> |
최고 점수 : <span id="highScore">0</span> |
남은 시간 : <span id="time">30</span>초 |
속도 : <span id="speed">0</span> 단계
</p>

<button onclick="startGame()">게임 시작</button>
<br>

<canvas
    id="gameCanvas"
    width="600"
    height="400">
</canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const highScoreText = document.getElementById("highScore");
const speedText = document.getElementById("speed");
const timeText = document.getElementById("time");

let score = 0;
let highScore = 0;
let speedLevel = 1;
let timeLeft = 30;

let gameRunning = false;
let timerId;
let animId;


// 공 정보
const ball = {
    x: 300,
    y: 200,
    radius: 25,
    dx: 3,
    dy: 2
};


// 게임 시작
function startGame(){

    if(animId){
        cancelAnimationFrame(animId);
    }

    score = 0;
    timeLeft = 30;
    speedLevel = 1;

    scoreText.textContent = score;
    timeText.textContent = timeLeft;
    speedText.textContent = speedLevel;

    ball.x = 300;
    ball.y = 200;
    ball.dx = 3;
    ball.dy = 2;

    gameRunning = true;

    clearInterval(timerId);

    timerId = setInterval(() => {

        timeLeft--;
        timeText.textContent = timeLeft;

        if(timeLeft <= 0){
            endGame();
        }

    }, 1000);

    drawGame();
}


// 게임 종료
function endGame(){

    gameRunning = false;

    clearInterval(timerId);

    if(animId){
        cancelAnimationFrame(animId);
    }


    // 최고 점수 확인
    if(score > highScore){
        highScore = score;
        highScoreText.textContent = highScore;
    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // 게임 종료 글자
    ctx.font = "32px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";


    ctx.fillText(
        "게임 종료!",
        canvas.width / 2,
        canvas.height / 2 - 60
    );


    ctx.fillText(
        "최종점수 : " + score,
        canvas.width / 2,
        canvas.height / 2
    );


    ctx.fillText(
        "최고점수 : " + highScore,
        canvas.width / 2,
        canvas.height / 2 + 60
    );
}


// 네온 공 그리기
function drawBall(){

    // 바깥쪽 빨간색
    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "red";
    ctx.shadowColor = "red";
    ctx.shadowBlur = 20;
    ctx.fill();


    // 토마토색
    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius - 5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "tomato";
    ctx.shadowColor = "tomato";
    ctx.shadowBlur = 15;
    ctx.fill();


    // 흰색
    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius - 10,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "white";
    ctx.shadowColor = "white";
    ctx.shadowBlur = 10;
    ctx.fill();


    // 가운데 검은색
    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius - 15,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "black";
    ctx.shadowColor = "black";
    ctx.shadowBlur = 5;
    ctx.fill();


    // 그림자 효과 초기화
    ctx.shadowBlur = 0;
}


// 공 움직이기
function updateBall(){

    ball.x += ball.dx;
    ball.y += ball.dy;


    // 왼쪽, 오른쪽 벽
    if(
        ball.x + ball.radius > canvas.width ||
        ball.x - ball.radius < 0
    ){
        ball.dx = -ball.dx;
    }


    // 위쪽, 아래쪽 벽
    if(
        ball.y + ball.radius > canvas.height ||
        ball.y - ball.radius < 0
    ){
        ball.dy = -ball.dy;
    }
}


// 게임 화면
function drawGame(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBall();
    updateBall();

    animId = requestAnimationFrame(drawGame);
}


// 캔버스 클릭
canvas.addEventListener("click", function(event){

    const rect = canvas.getBoundingClientRect();

    const mouseX = event.clientX - rect.left;
    const mouseY = event.clientY - rect.top;


    const dx = mouseX - ball.x;
    const dy = mouseY - ball.y;

    const distance = Math.sqrt(dx * dx + dy * dy);


    // 공을 클릭했는지 확인
    if(distance <= ball.radius){

        if(gameRunning){

            // 점수 증가
            score++;
            scoreText.textContent = score;


            // 속도 단계 증가
            speedLevel++;
            speedText.textContent = speedLevel;


            // 가로 속도 증가
            if(ball.dx > 0){
                ball.dx += 0.5;
            }
            else{
                ball.dx -= 0.5;
            }


            // 세로 속도 증가
            if(ball.dy > 0){
                ball.dy += 0.5;
            }
            else{
                ball.dy -= 0.5;
            }


            // 공을 랜덤한 위치로 이동
            moveBallRandom();
        }
    }
});


// 공을 랜덤한 위치로 이동
function moveBallRandom(){

    ball.x =
        Math.random() *
        (canvas.width - ball.radius * 2)
        + ball.radius;

    ball.y =
        Math.random() *
        (canvas.height - ball.radius * 2)
        + ball.radius;
}

</script>

</body>
</html>
