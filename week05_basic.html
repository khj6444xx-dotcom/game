
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <h1>Snake 게임</h1>
    <p>점수: <span id="score">0</span></p>
    <p>목숨: <span id="lives">3</span></p>
    <p>조작: 방향키 ↑ ↓ ← →</p>
    <p>일반 사과: 빨간색 | 황금 사과: 금색</p>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");
        const livesText = document.getElementById("lives");

        let score = 0;
        let lives = 3;
        let speed = 500;
        let gameInterval;

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5, golden: false };

        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;

        let gameOver = false;

        function drawTile(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(
                x * gridSize,
                y * gridSize,
                gridSize - 2,
                gridSize - 2
            );
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                if (i === 0) {
                    drawTile(snake[i].x, snake[i].y, "green");
                } else {
                    drawTile(snake[i].x, snake[i].y, "limegreen");
                }
            }
        }

        function drawFood() {
            if (food.golden) {
                drawTile(food.x, food.y, "gold");
            } else {
                drawTile(food.x, food.y, "red");
            }
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (event.key === "ArrowUp" && dy !== 1) {
                nextDx = 0;
                nextDy = -1;
            }

            if (event.key === "ArrowDown" && dy !== -1) {
                nextDx = 0;
                nextDy = 1;
            }

            if (event.key === "ArrowLeft" && dx !== 1) {
                nextDx = -1;
                nextDy = 0;
            }

            if (event.key === "ArrowRight" && dx !== -1) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        function moveSnake() {
            dx = nextDx;
            dy = nextDy;

            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                const goldenEaten = food.golden;

                if (goldenEaten) {
                    score += 2;
                    snake.push({ ...snake[snake.length - 1] });
                } else {
                    score++;
                }

                scoreText.textContent = score;

                moveFood();

                speed = Math.max(100, 500 - score * 30);

                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, speed);
            } else {
                snake.pop();
            }
        }

        function moveFood() {
            do {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            } while (
                snake.some(part =>
                    part.x === food.x && part.y === food.y
                )
            );

            food.golden = Math.random() < 0.2;
        }

        function checkCollsion() {
            const head = snake[0];

            if (
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount
            ) {
                loseLife();

                if (gameOver) return;

                head.x = Math.max(0, Math.min(tileCount - 1, head.x));
                head.y = Math.max(0, Math.min(tileCount - 1, head.y));

                return;
            }

            for (let i = 1; i < snake.length; i++) {
                if (
                    head.x === snake[i].x &&
                    head.y === snake[i].y
                ) {
                    loseLife();
                    return;
                }
            }
        }

        function loseLife() {
            lives--;
            livesText.textContent = lives;

            const removeCount = Math.min(3, snake.length - 1);

            if (removeCount > 0) {
                snake.splice(-removeCount, removeCount);
            }

            if (lives <= 0) {
                endGame();
                return;
            }

            const head = snake[0];

            head.x = Math.max(0, Math.min(tileCount - 1, head.x));
            head.y = Math.max(0, Math.min(tileCount - 1, head.y));

            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameInterval);

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText(
                "게임 오버!",
                canvas.width / 2,
                canvas.height / 2 - 20
            );

            ctx.fillText(
                "점수: " + score,
                canvas.width / 2,
                canvas.height / 2 + 30
            );
        }

        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            moveSnake();
            checkCollsion();

            if (gameOver) return;

            drawSnake();
            drawFood();
        }

        moveFood();
        drawSnake();
        drawFood();

        gameInterval = setInterval(gameLoop, speed);
    </script>

</body>

</html>
